[project]
name = "enterprise-kb-agent"
version = "0.1.0"
description = "企业内部员工知识问答智能体（本地文档 RAG + Agent）"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "langchain-chroma>=0.2.0",
    "opentelemetry-api>=1.37.0,<1.38.0",
    "opentelemetry-sdk>=1.37.0,<1.38.0",
    "opentelemetry-exporter-otlp-proto-common>=1.37.0,<1.38.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.37.0,<1.38.0",
    "fastapi>=0.141.0",
    "langchain>=1.3.0",
    "langchain-community>=0.4.0",
    "langchain-huggingface>=0.1.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.3.0",
    "sentence-transformers>=3.0.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.30.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "langfuse>=2.60.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
