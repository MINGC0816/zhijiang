# 企知 · Docker Compose（同机 API + Web）
# 用法见 docker/README.md

services:
  kb-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-kb-agent:1.0
    container_name: enterprise-kb-agent
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "${API_PORT:-8002}:8002"
    # 读取同目录 .env 做变量替换，并传入容器
    environment:
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://10.60.40.130:12333/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen3.5-VL-122B}
      VLLM_ENABLE_THINKING: ${VLLM_ENABLE_THINKING:-false}
      EMBEDDING_MODEL_PATH: /app/models/bge-small-zh-v1.5
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      JWT_KB_ADMIN_EXPIRE_MINUTES: ${JWT_KB_ADMIN_EXPIRE_MINUTES:-120}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      RETRIEVE_TOP_K: ${RETRIEVE_TOP_K:-4}
      CHUNK_SIZE: ${CHUNK_SIZE:-700}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # 持久化：原文、向量库、会话库、日志
      - kb_data:/app/data
    restart: unless-stopped
    # Linux 上若容器访问不了宿主机内网 LLM，可改为 network_mode: host
    # network_mode: host

volumes:
  kb_data:
